name: desktop

on:
  push:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
    tags: ["desktop-v*"]
  # Run by hand (Actions → desktop → Run workflow) to get a fresh tester .dmg.
  workflow_dispatch:
  pull_request:
    paths: ["desktop/**", ".github/workflows/desktop.yml"]

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/desktop-v') }}
    runs-on: macos-14
    timeout-minutes: 40
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: cargo test
        working-directory: desktop/src-tauri
        run: cargo test

      # [M3-05c] Unsigned tester .dmg (worker bundled, ad-hoc signed, not
      # notarized). Testers follow desktop/TESTERS.md. Not a public download.
      - name: Build the unsigned tester .dmg
        run: scripts/release.sh --unsigned

      - uses: actions/upload-artifact@v4
        with:
          name: cfw-render-tester-unsigned-universal
          path: |
            desktop/dist-release/CFW-Render-*-unsigned-universal.dmg
            desktop/dist-release/CFW-Render-*-unsigned-universal.dmg.sha256
          if-no-files-found: error

  # [M3-05a] Signed + notarized release on a `desktop-v<version>` tag. Needs the
  # owner's secrets (desktop/RELEASE.md) in the `desktop-release` environment.
  release:
    if: ${{ startsWith(github.ref, 'refs/tags/desktop-v') }}
    runs-on: macos-14
    timeout-minutes: 90
    environment: desktop-release
    defaults:
      run:
        working-directory: desktop
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      DESKTOP_RELEASE_BASE_URL: ${{ secrets.DESKTOP_RELEASE_BASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: desktop/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - run: pnpm install --frozen-lockfile

      - name: Tag matches tauri.conf.json version
        run: |
          v="$(python3 -c 'import json;print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          [ "desktop-v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != desktop-v$v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Import signing certificate into a temp keychain; write the API key
        env:
          APPLE_CERT_P12_BASE64: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          KC="$RUNNER_TEMP/release.keychain-db"
          KC_PW="$(uuidgen)"
          echo "::add-mask::$KC_PW"
          printf '%s' "$APPLE_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign, notarize, staple, package
        run: scripts/release.sh

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_DESKTOP_BUCKET: ${{ secrets.R2_DESKTOP_BUCKET }}
        run: |
          set -euo pipefail
          EP="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          D="dist-release"
          for f in "$D/CFW-Render-$VERSION.dmg" "$D/CFW-Render-$VERSION.app.tar.gz" "$D/CFW-Render-$VERSION.app.tar.gz.sig" "$D/latest.json"; do
            aws s3 cp "$f" "s3://$R2_DESKTOP_BUCKET/desktop/$VERSION/$(basename "$f")" --endpoint-url "$EP"
          done
          # The feed last, so it never points at files that are not there yet.
          aws s3 cp "$D/latest.json" "s3://$R2_DESKTOP_BUCKET/desktop/latest.json" --endpoint-url "$EP" \
            --cache-control "public, max-age=300" --content-type application/json

      - name: Remove the temp keychain and API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"
