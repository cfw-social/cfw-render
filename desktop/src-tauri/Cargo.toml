[package]
name = "cfw_render_app"
version = "0.1.0"
description = "CFW Render macOS companion app"
edition = "2021"
rust-version = "1.77"

[lib]
name = "cfw_render_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cfw_render_app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "7"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
dirs = "6"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
